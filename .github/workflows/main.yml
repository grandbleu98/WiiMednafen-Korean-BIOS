name: Build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # The source was imported from a ZIP, so Git submodule metadata for
    # wii-emucommon is not available in this new repository. Clone it with
    # all nested submodules (including SDL), otherwise SDL has no Makefile.
    - name: Fetch wii-emucommon and nested dependencies
      run: |
        rm -rf wii-emucommon
        git clone --recurse-submodules https://github.com/raz0red/wii-emucommon.git wii-emucommon

    # ZIP imports do not preserve executable bits on shell scripts.
    - name: Fix build script permissions
      run: chmod +x dist.sh wii-emucommon/dist.sh

    - name: Build WiiMednafen
      run: docker run -v "$(pwd):/source" raz0red/devkitppc /bin/bash /source/dist.sh /tmp/wiimednafen

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist
