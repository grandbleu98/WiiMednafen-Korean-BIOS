name: WiiMednafen Wii build

on:
  push:
    branches:
      - feature/chd-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman --noconfirm -Sy
          pacman --noconfirm -S --needed make git zip
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          powerpc-eabi-gcc --version
      - name: Build WiiMednafen
        run: make -j2
      - name: Verify output
        run: |
          test -s boot.dol
          file boot.dol || true
      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: wiimednafen-chd-build
          path: boot.dol
          if-no-files-found: error
